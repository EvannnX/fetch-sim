<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Fetch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one full-height stage holding the bare Fetch, a single question field docked under it. */
:root{
  --bg:#e7eae8; --stage:#d4d9d6; --ink:#141819; --muted:#5a6461; --line:#c3cbc8; --field:#f7f9f8; --copper:#b05f25;
  --f-body:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1213;--stage:#0a0c0d;--ink:#e4e8e6;--muted:#8c9693;--line:#2a3134;--field:#171b1d;--copper:#e08a4f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1213;--stage:#0a0c0d;--ink:#e4e8e6;--muted:#8c9693;--line:#2a3134;--field:#171b1d;--copper:#e08a4f;color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#stage{flex:1;min-height:280px;position:relative;border-radius:10px;overflow:hidden;background:var(--stage);touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#ask{display:flex;gap:8px;width:100%;max-width:640px;margin-inline:auto}
#q{flex:1;min-width:0;font:15px var(--f-body);padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
#q::placeholder{color:var(--muted)}
#send{font:500 15px var(--f-body);padding:0 18px;border-radius:8px;border:1px solid var(--copper);background:var(--copper);color:#fff;cursor:pointer}
#send:disabled{opacity:.55;cursor:default}
#q:focus-visible,#send:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.ico{flex:none;width:44px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.ico svg{width:20px;height:20px}
.ico[aria-pressed="true"]{border-color:var(--copper);color:var(--copper)}
.ico[data-live="true"]{background:var(--copper);color:#fff}
.ico:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
#cam{position:absolute;right:12px;top:12px;width:min(30%,200px);aspect-ratio:4/3;object-fit:cover;border-radius:8px;transform:scaleX(-1);border:1px solid var(--line);background:#000}
#cam[hidden]{display:none}
#keyRow{display:flex;flex-wrap:wrap;gap:8px;width:100%;max-width:640px;margin-inline:auto}
#keyRow[hidden]{display:none}
#keyRow select{font:14px var(--f-body);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
#keyRow input{flex:1 1 140px;min-width:0;font:14px var(--f-body);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
#keyRow button{font:500 14px var(--f-body);padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
#modeSw{position:absolute;right:12px;bottom:12px;display:flex;padding:3px;gap:2px;border-radius:999px;background:var(--field);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.12)}
#modeSw button{font:500 13px var(--f-body);padding:6px 14px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
#modeSw button[aria-checked="true"]{background:var(--copper);color:#fff}
#modeSw button:focus-visible{outline:2px solid var(--copper);outline-offset:1px}
#note{margin:-4px auto 0;font-size:12.5px;color:var(--muted);text-align:center;max-width:640px}
</style>

<div id="stage"><video id="cam" muted playsinline hidden></video><div id="modeSw" role="radiogroup" aria-label="Reply style"><button type="button" role="radio" data-m="clear">Clear</button><button type="button" role="radio" data-m="abstract">Abstract</button></div></div>
<form id="ask" autocomplete="off"><button id="camBtn" class="ico" type="button" aria-pressed="false" aria-label="Camera" title="Camera: let Fetch see your gestures"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h3.2L8 5h8l1.8 2.5H21V19H3z"/><circle cx="12" cy="12.5" r="3.6"/></svg></button><button id="setBtn" class="ico" type="button" hidden aria-label="Settings" title="Model and API key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button><button id="micBtn" class="ico" type="button" hidden aria-pressed="false" aria-label="Speak" title="Speak to Fetch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button><input id="q" type="text" maxlength="200" placeholder="Say something to Fetch" aria-label="Message"><button id="send" type="submit">Send</button></form>
<form id="keyRow" autocomplete="off" hidden><select id="prov" aria-label="Model provider"><option value="claude">Claude</option><option value="doubao">Doubao</option></select><input id="key" type="password" placeholder="API key (stays in this browser)" aria-label="API key"><input id="model" type="text" placeholder="Doubao model or ep- id" aria-label="Doubao model"><input id="endpoint" type="url" placeholder="Proxy URL (optional)" aria-label="Proxy URL"><button type="submit">Save</button></form>
<p id="note" hidden></p>

  if(LIVE.on){for(let c=0;c<COLS;c++){const k=Math.round(Math.min(1,LIVE.lv[c])*5);for(let j=0;j<k;j++)g[(FEED-2-j)*COLS+c]=1;}return;}

  if(st.set){SEQ=transition(CUR,st.set);if(!SEQ.length)SEQ=[frameOf(CUR)];FORM={st,left:REFILLS};FW.restart=true;phase='form';return;}

  if(FW.restart||FW.n<SEQ.length-1)return;

function buildFrame(n,out){

  for(let y=0;y<Hh;y++)for(let x=0;x<W;x++){const v=FW.g[(Hh-1-y)*W+x];if(v>0)out[fwIdx(x,y)]=Math.min(65535,Math.round(v*P.duty));}

function firmware(){
  let guard=0;
  while(FW.cpu<=S.t&&guard++<5000){
    const now=Math.floor(FW.cpu*1000)/1000;          // millis()

    if(FW.restart){FW.restart=false;FW.period=Math.floor(1000/P.fps)/1000;FW.n=0;buildFrame(0,FW.cur);buildFrame(1,FW.next);
      shiftOutFrame();FW.tNext=now+FW.period;S.frames.push(now);syncTarget();continue;}   // playAnimation()
    if(now>=FW.tNext){

function coils(dt){

    const cu=pixU(i%COLS),cv=pixV(Math.floor(i/COLS)),gi=Math.round(cu/CELL),gj=Math.round(cv/CELL);
    for(let j=Math.max(0,gj-KR);j<=Math.min(GH-1,gj+KR);j++){const dv=j*CELL-cv;
      for(let k=Math.max(0,gi-KR);k<=Math.min(GW-1,gi+KR);k++){const du=k*CELL-cu;const q=1+(du*du+dv*dv)/(FIELD_A*FIELD_A);H[j*GW+k]+=f/(q*Math.sqrt(q));}}}

/* ───────── fluid: overdamped particles, Kelvin force ∝ ∇H², gravity, pressure ───────── */

  for(let p=0;p<N;p++){const c=(pu[p]/HN|0)+(pv[p]/HN|0)*HC;nxt[p]=head[c];head[c]=p;}

/* Doubao (Volcengine Ark), OpenAI-style chat completions. Structured output first; if the model rejects a parameter,
   retry with plain JSON mode, then with no format at all. Images go in as data URLs. */
const ARK_URL='https://ark.cn-beijing.volces.com/api/v3/chat/completions';
async function doubaoJSON(prompt,imgs,c){
  if(!c.key&&!c.endpoint)throw {code:'no_key'};
  const content=[];for(const im of imgs)content.push({type:'image_url',image_url:{url:'data:image/jpeg;base64,'+await b64(im)}});
  content.push({type:'text',text:prompt+SCHEMA_NOTE});
  const tries=[
    {response_format:{type:'json_schema',json_schema:{name:'fetch_reply',strict:true,schema:REPLY_SCHEMA}},thinking:{type:'disabled'}},
    {response_format:{type:'json_object'}},
    {}];
  let last=null;
  for(const extra of tries){
    let r;try{r=await fetch(c.endpoint||ARK_URL,{method:'POST',headers:{'Content-Type':'application/json',...(c.key?{Authorization:'Bearer '+c.key}:{})},
      body:JSON.stringify({model:c.model,messages:[{role:'user',content}],max_tokens:4096,...extra})});}
    catch{throw {code:'network'};}                 // blocked by CORS or offline: use a proxy
    if(r.ok){const j=await r.json();return parseReply(j?.choices?.[0]?.message?.content||'');}
    if(r.status===401||r.status===403)throw {code:'bad_key'};
    if(r.status===429)throw {code:'rate_limited'};
    last=r.status;if(r.status!==400)break;}
  throw {code:'failed',status:last};
}

    else{note.textContent=code==='rate_limited'?'Too many messages. Try again in a moment.':code==='images_unavailable'||code==='image_rejected'?'Camera frames could not be sent this time. Words still work.':'No reply came back. Try again.';note.hidden=false;playSteps([{effect:'hold',seconds:1}]);}
  }finally{busy(false);}
}

function advance(frameDt){
  const sub=4,dt=frameDt/sub;
  for(let k=0;k<sub;k++){S.t+=dt;firmware();coils(dt);field();fluid(dt);}
  sequencer();
  while(S.frames.length>8)S.frames.shift();

}

function loop(now){const fdt=Math.max(0,Math.min(.05,(now-last)/1000));last=Math.max(last,now);
